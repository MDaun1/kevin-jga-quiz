<!DOCTYPE html>
<html>
<head>
  <title>Kevins Ultimate JGA Quiz</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>

  <h1>Kevins Ultimate JGA Quiz 🎉</h1>

  <!-- Fortschrittsanzeige -->
  <div id="progress">Beantwortet: 0 / 0</div>


  <div id="wheel-container">
    <div id="pointer"></div>
    <img id="wheel" src="src/Glücksrad.png">
  </div>

  <button onclick="spinWheel()">🎰 Glücksrad drehen!</button>

  <h2 id="category"></h2>
  <h2 id="question"></h2>

  <button id="showAnswerBtn" style="display:none;" onclick="showAnswer()">Antwort anzeigen</button>

  <div id="answer"></div>

  <!-- Vollbild-Bilder (müssen außerhalb von resultButtons liegen!) -->
<img id="correctImage" src="src/richtig.png" style="display:none;">
<img id="wrongImage" src="src/falsch.png" style="display:none;">

<div id="resultButtons" style="display:none;">
  <button id="correctBtn" onclick="markCorrect()">✔️ Richtig beantwortet</button>
  <button id="wrongBtn" onclick="markWrong()">❌ Falsch beantwortet</button>
</div>


  <script src="src/questions.js"></script>
  <script src="src/app.js"></script>

  <audio id="correctSound" src="src/richtigsound.mp3"></audio>
  <audio id="wrongSound" src="src/falschsound.mp3"></audio>

</body>
</html>
